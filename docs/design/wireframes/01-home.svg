  <g id="notas">
    <text class="nota" x="40" y="950">Nota: eventos y categorías quedan dentro de la primera pantalla: en móvil (812 px) y en escritorio (800 px).</text>
    <text class="nota" x="40" y="976">Nota: el logo lleva al Home; el menú no tiene «Inicio». La cabecera muestra la etiqueta DEMO del sitio.</text>
    <text class="nota" x="40" y="1002">Nota: SEO. Title y H1 de Home con «boletos para El Salvador» y eventos tecnológicos; meta description sin cifras no respaldadas.</text>
    <text class="nota" x="40" y="1028">Nota: UX. Diego busca el filtro «Gratis» al primer vistazo; Andrea ve «Desde $XX.XX» en cada tarjeta.</text>
    <text class="nota" x="40" y="1054">Nota: las 12 categorías usan los nombres y el orden del Excel; cada tarjeta de evento lleva la ilustración de su tipo.</text>
    <text class="nota" x="40" y="1080">Nota: texto de marcador. Títulos, fechas y precios son ejemplos DEMO, no datos reales.</text>
